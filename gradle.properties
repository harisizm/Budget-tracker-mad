# Gradle daemon memory. Kept modest on purpose: this laptop has 16 GB and the
# emulator takes 2 GB, and an earlier Studio project crashed the daemon with
# a native out-of-memory at -Xmx2048m.
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
# Skips the configuration phase on unchanged builds. Makes the save -> install loop faster.
org.gradle.configuration-cache=true
org.gradle.caching=true
android.useAndroidX=true
